<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分電盤エディタ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{font-family:"Noto Sans JP",system-ui,sans-serif;background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);margin:0;scroll-behavior:smooth}
  .mono{font-family:"IBM Plex Mono",monospace}
  .sched-input{width:100%;background:transparent;outline:none;padding:2px 4px;border-radius:4px;font-size:11px;transition:background .15s}
  .sched-input:focus{background:#fef3c7;box-shadow:inset 0 0 0 1px #f59e0b}
  .btn-tab{border:1px solid #cbd5e1;padding:2px 8px;border-radius:8px;font-size:11px;background:#fff;min-width:44px;transition:all .15s}
  .btn-tab:hover{border-color:#94a3b8}
  .btn-tab.active{background:#0f172a;color:#fff;border-color:#0f172a;box-shadow:0 2px 6px rgba(15,23,42,.25)}
  .btn-ghost{border:1px solid #e2e8f0;padding:5px 12px;border-radius:10px;background:#fff;font-size:13px;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .btn-ghost:hover{background:#f8fafc;transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.06)}
  .btn-ghost:active{transform:translateY(0)}
  #paper{width:257mm;min-height:182mm;margin:auto;overflow:hidden}
  #diagram{width:100%;height:280px;display:block;min-width:720px}
  .screen-sched table{table-layout:fixed}
  .screen-sched th,.screen-sched td{padding:3px 4px;font-size:11px}
  @media (max-width:1024px){
    #paper{width:100%!important;min-height:auto!important;padding:4vw!important;border-radius:16px}
    #diagram{height:240px}
  }
  @media print{
    @page{size:B5 landscape;margin:4mm}
    html,body{background:#fff!important;width:257mm;height:182mm;overflow:hidden!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{zoom:0.92}
    .no-print{display:none!important}
    #paper{width:100%!important;min-height:auto!important;margin:0!important;padding:2mm!important;box-shadow:none!important;border:none!important;border-radius:0!important;overflow:hidden!important}
    h1{font-size:14pt!important;margin:0 0 2mm 0!important;line-height:1.1!important}
    .screen-sched{margin-top:2mm!important;gap:3mm!important;transform:scale(0.96);transform-origin:top left;width:104%}
    .screen-sched th,.screen-sched td{font-size:8.5pt!important;padding:1px 2px!important;line-height:1.1!important}
    .sched-input{font-size:8.5pt!important;padding:0 2px!important}
    .btn-tab{font-size:8pt!important;padding:0 3px!important;min-width:30px!important;border-radius:3px!important}
    #diagram{width:100%!important;height:92mm!important;max-width:100%!important;display:block!important;min-width:0!important}
    svg text{font-size:10px!important}
    #printList{display:none!important}
  }
</style>
</head>
<body class="text-slate-800">
<div class="no-print sticky top-0 z-40 backdrop-blur bg-white/80 border-b shadow-sm">
  <div class="max-w-[1400px] mx-auto px-3 sm:px-4 py-3 flex flex-wrap gap-2.5 items-center">
    <div class="flex items-center gap-2"><span class="text-[11px] text-slate-600">引込</span>
      <select id="inlet" class="border rounded-lg px-2 py-1.5 text-sm bg-white">
        <option selected>CVT 8sq</option><option>CVT 14sq</option><option>CVT 22sq</option><option>CVT 38sq</option><option>CVT 60sq</option><option>SV 8sq</option><option>SV 14sq</option><option>SV 22sq</option><option>VVF2.0-3C</option><option>VVF2.6-3C</option>
      </select></div>
    <div class="flex items-center gap-2">
      <span class="text-[11px] text-slate-600">メーター</span>
      <select id="meterType" class="border rounded-lg px-2 py-1.5 text-sm bg-white">
        <option selected>1φ3W</option>
        <option>1φ2W</option>
      </select>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[11px] text-slate-600">開閉器</span>
      <button id="tglSwitch" class="btn-tab">なし</button>
      <select id="switchAmp" class="border rounded-lg px-2 py-1.5 text-sm bg-white">
        <option>10A</option><option>15A</option><option>20A</option><option>30A</option><option>40A</option><option selected>50A</option><option>60A</option>
      </select>
    </div>
    <div class="flex items-center gap-2"><span class="text-[11px] text-slate-600">主幹</span>
      <select id="mainType" class="border rounded-lg px-2 py-1.5 text-sm bg-white"><option selected>ELB</option><option>MCB</option></select>
      <select id="mainAmp" class="border rounded-lg px-2 py-1.5 text-sm bg-white"><option>20A</option><option>30A</option><option>40A</option><option selected>50A</option><option>60A</option><option>75A</option><option>100A</option><option>125A</option></select>
    </div>
    <div class="flex items-center gap-1.5">
      <input id="siteName" placeholder="現場名" class="border rounded-lg px-3 py-1.5 text-sm w-36 sm:w-56 bg-white/70 focus:outline-none focus:ring-2 focus:ring-slate-900/10" value="">
      <span class="text-[11px] text-slate-600 ml-1">回路数</span>
      <button id="minus2" class="btn-ghost">-2</button><span id="circCount" class="w-7 text-center tabular-nums">16</span><button id="plus2" class="btn-ghost">+2</button>
    </div>
    <div class="ml-auto flex gap-2"><button id="reset" class="btn-ghost">初期化</button><button id="print" class="bg-slate-900 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-black transition shadow-sm hover:shadow-md">PDF/印刷</button></div>
  </div>
</div>

<div class="max-w-[1400px] mx-auto my-4 sm:my-6 px-2 sm:px-0">
<div id="paper" class="bg-white shadow-xl ring-1 ring-slate-900/5 rounded-2xl p-4 sm:p-6">
<div class="flex items-baseline justify-between">
  <h1 class="text-[22px] font-bold tracking-tight" id="docTitle">分電盤図</h1>
  <div class="text-[11px] text-slate-500">B5横 / 自動レイアウト</div>
</div>
<div class="border rounded-xl overflow-x-auto mt-3 bg-gradient-to-b from-slate-50/80 to-white"><svg id="diagram" viewBox="0 0 1220 460"></svg></div>
<div id="printList" class="hidden print:block mt-2"></div>
<div class="grid md:grid-cols-2 gap-5 sm:gap-6 mt-6 screen-sched">
  <div><div class="text-[12px] font-semibold mb-1.5 text-slate-700">回路表</div><div id="schedLeft" class="border rounded-xl overflow-hidden bg-white"></div></div>
  <div><div class="text-[12px] font-semibold mb-1.5 text-slate-700">回路表</div><div id="schedRight" class="border rounded-xl overflow-hidden bg-white"></div></div>
</div></div></div>

<script>
const NS="http://www.w3.org/2000/svg",$=s=>document.querySelector(s),svg=$("#diagram");
let state={inlet:"CVT 8sq",meterType:"1φ3W",hasSwitch:false,switchAmp:"50A",mainType:"ELB",mainAmp:"50A",circuits:[],site:""};

function initCircuits(n=16){
  state.circuits=Array.from({length:n},(_,i)=>({no:i+1,name:["照明","コンセント","エアコン","冷蔵庫","電子レンジ","IH","洗面","トイレ","外灯","予備"][i]||`回路${i+1}`,voltage:100,amp:20}));
  $("#circCount").textContent=n;
}
function getMaxCols(){return Math.ceil(state.circuits.length/2);}
function resizeCircuits(newCount){
  newCount=Math.max(2,Math.min(newCount,80));
  const old=[...state.circuits];
  state.circuits=Array.from({length:newCount},(_,i)=>old[i]||{no:i+1,name:`回路${i+1}`,voltage:100,amp:20});
  state.circuits.forEach((c,i)=>c.no=i+1);
  document.getElementById("circCount").textContent=newCount;
}
function sLine(x1,y1,x2,y2,w=1.7){const l=document.createElementNS(NS,"line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("stroke","#0f172a");l.setAttribute("stroke-width",w);l.setAttribute("stroke-linecap","round");svg.appendChild(l)}
function sRect(x,y,w,h,r=0){const e=document.createElementNS(NS,"rect");e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("width",w);e.setAttribute("height",h);e.setAttribute("rx",r);e.setAttribute("fill","#fff");e.setAttribute("stroke","#0f172a");e.setAttribute("stroke-width",1.7);svg.appendChild(e)}
function sCircle(x,y,r){const e=document.createElementNS(NS,"circle");e.setAttribute("cx",x);e.setAttribute("cy",y);e.setAttribute("r",r);e.setAttribute("fill","#fff");e.setAttribute("stroke","#0f172a");e.setAttribute("stroke-width",1.7);svg.appendChild(e)}
function sText(x,y,t,s=12,w=500,a="middle"){const e=document.createElementNS(NS,"text");e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("text-anchor",a);e.setAttribute("font-size",s);e.setAttribute("font-weight",w);e.setAttribute("fill","#0f172a");e.textContent=t;svg.appendChild(e)}

function renderDiagram(){
  svg.innerHTML="";const leftX=180,busY=300;
  sText(60,32,state.inlet,13,600,"start");sText(leftX-70,78,state.meterType,14,600,"start");
  for(let i=-1;i<=1;i++)sLine(leftX-12+i*8,60,leftX-22+i*8,80);
  sLine(leftX-17,70,leftX-2,70,2);sLine(leftX,70,leftX,110);
  sCircle(leftX,130,22);sText(leftX,135,"WH",12,700);sLine(leftX,152,leftX,185);
  let curY=185;
  if(state.hasSwitch){
    sRect(leftX-20,curY,40,28,3);
    sLine(leftX-20,curY+28,leftX+20,curY);

    // 左側へ移動（線と重ならない位置）
    sText(leftX-75,curY+18,state.switchAmp+"A",12,700,"end");
    sText(leftX-75,curY+34,"開閉器",11,500,"end");

    sLine(leftX,curY+28,leftX,curY+55);
    curY+=55;
}
  const mainY=curY+8;sRect(leftX-28,mainY,56,42,4);sText(leftX,mainY+18,state.mainType,13,700);sText(leftX,mainY+35,state.mainAmp,12,600);
  sLine(leftX,mainY+42,leftX,busY);sLine(leftX,busY,leftX+26,busY,2.2);
  
  const cols=getMaxCols();
  const startX=260;
  let pitch=64;
  if(cols>=10) pitch=56;
  if(cols>=14) pitch=50;
  if(cols>=18) pitch=44;
  if(cols>=22) pitch=40;
  const busEnd=startX+(cols*pitch)+80;
  
  let svgH=460;
  if(cols>=20) svgH=420;
  if(cols>=26) svgH=390;
  if(cols>=32) svgH=360;
  svg.setAttribute("viewBox",`0 0 ${busEnd+60} ${svgH}`);
  
  sLine(leftX+26,busY,busEnd,busY,3);
  const topY=busY-58,botY=busY+58;
  state.circuits.forEach((c,i)=>{const col=Math.floor(i/2),isTop=i%2===0,x=startX+col*pitch,yB=isTop?topY:botY;
    sLine(x,busY,x,isTop?yB+14:yB-14);sRect(x-14,yB-14,28,28,3);sText(x,yB+4,c.amp+"A",11,700);
    const ny=isTop?yB-36:yB+36;if(c.voltage===100){sCircle(x,ny,10);sText(x,ny+4,c.no,11)}else{sCircle(x,ny,14);sCircle(x,ny,10);sText(x,ny+4,c.no,11)}
  });
  sLine(busEnd,busY-8,busEnd,busY+8,2);
}

function renderSchedule(){
  const make=list=>{const w=document.createElement("div");const t=document.createElement("table");t.className="w-full text-[12px]";t.innerHTML=`<thead class="bg-slate-50/80"><tr class="border-b border-slate-200"><th class="w-11 py-1.5 font-medium">No</th><th class="text-left py-1.5 font-medium">回路名称</th><th class="w-24 py-1.5 font-medium">電圧</th><th class="w-20 py-1.5 font-medium">容量</th></tr></thead><tbody></tbody>`;const b=t.querySelector("tbody");
    list.forEach(c=>{const r=document.createElement("tr");r.className="border-b border-slate-100 hover:bg-amber-50/40";r.innerHTML=`<td class="text-center mono text-slate-700">${c.no}</td><td><input data-no="${c.no}" data-k="name" class="sched-input" value="${c.name}"></td><td class="text-center"><button data-no="${c.no}" data-k="v100" class="btn-tab ${c.voltage===100?'active':''} mr-1">100V</button><button data-no="${c.no}" data-k="v200" class="btn-tab ${c.voltage===200?'active':''}">200V</button></td><td class="text-center"><button data-no="${c.no}" data-k="a20" class="btn-tab ${c.amp===20?'active':''} mr-1">20A</button><button data-no="${c.no}" data-k="a30" class="btn-tab ${c.amp===30?'active':''}">30A</button></td>`;b.appendChild(r)});w.appendChild(t);return w};
  const circuits=state.circuits;const h=Math.ceil(circuits.length/2);$("#schedLeft").innerHTML="";$("#schedRight").innerHTML="";$("#schedLeft").appendChild(make(circuits.slice(0,h)));$("#schedRight").appendChild(make(circuits.slice(h)));
}
let renderTimer=null;function safeRender(){if(renderTimer)cancelAnimationFrame(renderTimer);renderTimer=requestAnimationFrame(renderAll);}
function renderAll(){
  renderDiagram();renderSchedule();document.getElementById("docTitle").textContent=state.site||"分電盤図";
}
$("#inlet").onchange=e=>{state.inlet=e.target.value;safeRender()};
$("#meterType").onchange=e=>{state.meterType=e.target.value;safeRender()};
$("#switchAmp").onchange=e=>{state.switchAmp=e.target.value;safeRender()};
$("#mainType").onchange=e=>{state.mainType=e.target.value;safeRender()};
$("#mainAmp").onchange=e=>{state.mainAmp=e.target.value;safeRender()};
$("#tglSwitch").onclick=e=>{state.hasSwitch=!state.hasSwitch;e.currentTarget.classList.toggle("active",state.hasSwitch);e.currentTarget.textContent=state.hasSwitch?"あり":"なし";safeRender()};
$("#plus2").onclick=()=>{resizeCircuits(state.circuits.length+2);safeRender()};
$("#minus2").onclick=()=>{resizeCircuits(state.circuits.length-2);safeRender()};
$("#reset").onclick=()=>{
  state.inlet="CVT 8sq";
  state.meterType="1φ3W";
  state.hasSwitch=false;
  state.switchAmp="50A";
  state.mainType="ELB";
  state.mainAmp="50A";
  state.site="";
  $("#inlet").value=state.inlet;
  $("#meterType").value=state.meterType;
  $("#switchAmp").value=state.switchAmp;
  $("#mainType").value=state.mainType;
  $("#mainAmp").value=state.mainAmp;
  $("#siteName").value="";
  const switchBtn=$("#tglSwitch");
  switchBtn.classList.remove("active");
  switchBtn.textContent="なし";
  initCircuits(16);
  safeRender()
};
$("#print").onclick=()=>window.print();
$("#siteName").oninput=e=>{state.site=e.target.value;document.getElementById("docTitle").textContent=state.site||"分電盤図"};
document.addEventListener('input',e=>{if(e.target.classList.contains('sched-input')){const no=Number(e.target.dataset.no);const c=state.circuits.find(x=>x.no===no);if(c)c.name=e.target.value}});
document.addEventListener('click',e=>{const btn=e.target.closest('button[data-k]');if(!btn)return;const no=Number(btn.dataset.no);const c=state.circuits.find(x=>x.no===no);if(!c)return;const k=btn.dataset.k;if(k==="v100")c.voltage=100;if(k==="v200")c.voltage=200;if(k==="a20")c.amp=20;if(k==="a30")c.amp=30;safeRender()});
window.addEventListener("error",e=>console.warn("UI Error:",e.message));
initCircuits(16);safeRender();
</script>
</body>
</html>
